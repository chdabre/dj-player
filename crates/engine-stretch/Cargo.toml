[package]
name = "engine-stretch"
description = "Time-stretchers for keylock behind one Stretcher trait."
version.workspace = true
edition.workspace = true
# src/bungee/ is MPL-2.0 (ported from Bungee, Parabola Research); everything else is
# GPL-3.0-or-later.
license = "GPL-3.0-or-later AND MPL-2.0"
