[package]
name = "ui"
description = "UI shell spike: the main playback screen in raw wgpu, driving one deck in-process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dj-ui"
path = "src/main.rs"

[features]
default = ["standin"]
# The hardware stand-in: on-screen stand-ins for the physical controls around the device
# screen, for development on a laptop. A device build leaves it out (--no-default-features).
standin = []

[dependencies]
engine-core.workspace = true
engine-io.workspace = true
engined = { path = "../engined" }
library.workspace = true
surface.workspace = true
waveform = { workspace = true, default-features = false }
assert_no_alloc.workspace = true
wgpu = "30"
winit = "0.30.13"
glyphon = "0.12"
pollster = "1"
png = "0.18"

[lints]
workspace = true
