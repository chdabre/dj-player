[package]
name = "engine-analysis"
description = "Track analysis (tempo, beatgrid, key) behind pluggable backends, plus a ground-truth scorer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["stratum"]
# stratum-dsp: pure Rust, MIT OR Apache-2.0.
stratum = ["dep:stratum-dsp"]
# Essentia (AGPL-3.0) through a Python worker process: classic DSP, and the TempoCNN model.
# Needs a Python with `essentia-tensorflow`; see docs/plan/analysis.md.
essentia = ["dep:serde_json"]

[dependencies]
engine-media.workspace = true
quick-xml.workspace = true
rustfft.workspace = true
serde_json = { workspace = true, optional = true }
stratum-dsp = { workspace = true, optional = true }

[lints]
workspace = true
