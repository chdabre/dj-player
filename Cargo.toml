[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.87"

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-media = { path = "crates/engine-media" }
engine-io = { path = "crates/engine-io" }
engine-stretch = { path = "crates/engine-stretch" }
engine-analysis = { path = "crates/engine-analysis" }
waveform = { path = "crates/waveform", default-features = false }
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false }
rubato = "5"
stratum-dsp = "1.0.0"
quick-xml = "0.42"
serde_json = "1"
rustfft = "6.2"
tract-onnx = "0.23"
cpal = "0.18"
assert_no_alloc = "1.1"
hound = "3.5"
criterion = "0.8"
crossterm = "0.29"
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = true

# Analysis is minutes of FFTs per track when unoptimised; keep tests and debug runs usable.
[profile.dev.package.stratum-dsp]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
