name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libclang-dev
      # The release bench build (with debug info) of the whole workspace no longer fits on the
      # runner's disk next to the preinstalled toolchains we don't use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features engine-analysis/essentia -- -D warnings
      - run: cargo test --workspace
      - name: Bench compiles
        run: cargo bench --workspace --no-run
        env:
          # Only checks that benches build; full debug info is for local profiling.
          CARGO_PROFILE_BENCH_DEBUG: line-tables-only

  cross-aarch64:
    name: cross-build aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      PKG_CONFIG_SYSROOT_DIR: /
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: arm64 multiarch (cross gcc, ALSA headers, qemu)
        run: |
          # Pin the existing amd64 sources to amd64 and add the arm64 ports mirror.
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross libasound2-dev:arm64 pkg-config qemu-user libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      # The keylock shootout spike is left out: Bungee's CMake build is not set up for cross
      # compiling. It is built and run natively on the Pi instead.
      - name: Build (release, all targets)
        run: cargo build --workspace --exclude keylock-shootout --all-targets --release --target aarch64-unknown-linux-gnu
      - name: Test engine-core and engine-media under qemu
        run: cargo test -p engine-core -p engine-media -p engine-stretch -p library --target aarch64-unknown-linux-gnu
